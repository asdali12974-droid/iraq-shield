# IRAQ SHIELD — P0 local stack.
# Bring up:   docker compose -f infra/docker-compose.yml --env-file .env up -d --build
# Tear down:  docker compose -f infra/docker-compose.yml down
#
# SECURITY POSTURE (local/on-prem):
# - All published ports bind to 127.0.0.1 only: datastores are NOT exposed on
#   external interfaces. In production, front `api`/`web` with a reverse proxy
#   (TLS) and keep datastores on the internal network with no host publishing.
# - Redis requires a password. Postgres/Neo4j/MinIO use credentials from .env.
# - OpenSearch security plugin is DISABLED for local dev only (see note below).
#   Production MUST enable the security plugin + TLS.
name: iraq-shield

x-restart: &restart
  restart: unless-stopped

networks:
  iraqshield:
    driver: bridge

volumes:
  pg_data:
  minio_data:
  opensearch_data:
  neo4j_data:

services:
  postgres:
    <<: *restart
    # Bundles PostgreSQL 16 + TimescaleDB + PostGIS + pgvector.
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${IS_POSTGRES_USER:-iraqshield}
      POSTGRES_PASSWORD: ${IS_POSTGRES_PASSWORD:?set IS_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${IS_POSTGRES_DB:-iraqshield}
    volumes:
      - pg_data:/home/postgres/pgdata/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${IS_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IS_POSTGRES_USER:-iraqshield} -d ${IS_POSTGRES_DB:-iraqshield}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [iraqshield]

  redis:
    <<: *restart
    image: redis:7-alpine
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${IS_REDIS_PASSWORD:?set IS_REDIS_PASSWORD in .env}"
    ports:
      - "127.0.0.1:${IS_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${IS_REDIS_PASSWORD:?set IS_REDIS_PASSWORD in .env}
    networks: [iraqshield]

  minio:
    <<: *restart
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${IS_MINIO_ACCESS_KEY:-iraqshield}
      MINIO_ROOT_PASSWORD: ${IS_MINIO_SECRET_KEY:?set IS_MINIO_SECRET_KEY in .env}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [iraqshield]

  # Creates the raw-archive bucket once MinIO is healthy, then exits.
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      IS_MINIO_ACCESS_KEY: ${IS_MINIO_ACCESS_KEY:-iraqshield}
      IS_MINIO_SECRET_KEY: ${IS_MINIO_SECRET_KEY:?set IS_MINIO_SECRET_KEY in .env}
      IS_MINIO_BUCKET_RAW: ${IS_MINIO_BUCKET_RAW:-raw-archive}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$IS_MINIO_ACCESS_KEY $$IS_MINIO_SECRET_KEY &&
      mc mb --ignore-existing local/$$IS_MINIO_BUCKET_RAW &&
      echo 'bucket ready';
      "
    networks: [iraqshield]

  opensearch:
    <<: *restart
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      # !!! LOCAL DEV ONLY !!! Production MUST remove this and enable the
      # security plugin (auth + TLS). Tracked as a production-readiness item.
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:${IS_OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
    networks: [iraqshield]

  neo4j:
    <<: *restart
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: ${IS_NEO4J_USER:-neo4j}/${IS_NEO4J_PASSWORD:?set IS_NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j_data:/data
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
    networks: [iraqshield]

  api:
    <<: *restart
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file: ../.env
    environment: &backend_env
      IS_POSTGRES_HOST: postgres
      IS_REDIS_HOST: redis
      IS_REDIS_PASSWORD: ${IS_REDIS_PASSWORD:?set IS_REDIS_PASSWORD in .env}
      IS_MINIO_ENDPOINT: minio:9000
      IS_OPENSEARCH_HOST: opensearch
      IS_NEO4J_URI: bolt://neo4j:7687
      # Worker + API share the archive via MinIO (not the local filesystem).
      IS_RAW_STORE_BACKEND: minio
    depends_on: &backend_deps
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"
    networks: [iraqshield]

  # Celery worker: executes collection jobs (shares runner logic with the API).
  worker:
    <<: *restart
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    command: ["worker"]
    env_file: ../.env
    environment: *backend_env
    depends_on: *backend_deps
    networks: [iraqshield]

  # Celery beat: schedules due sources for collection every minute.
  scheduler:
    <<: *restart
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    command: ["scheduler"]
    env_file: ../.env
    environment: *backend_env
    depends_on: *backend_deps
    networks: [iraqshield]

  web:
    <<: *restart
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:80"
    networks: [iraqshield]
