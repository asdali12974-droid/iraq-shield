server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # No external origins: fonts are self/system (data sovereignty). Adjust
    # connect-src to match your API origin (default matches VITE_API_BASE_URL).
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8000; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # SPA fallback: unknown routes are served by the client-side router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
