[project]
name = "iraq-shield-api"
version = "0.1.0"
description = "IRAQ SHIELD — OSINT & intelligence platform API (P0 foundation)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# Alembic migrations are generated-style; long column definitions are fine.
"alembic/versions/*" = ["E501"]
# Tests favor readable literals/fixtures over strict wrapping.
"tests/*" = ["E501"]
